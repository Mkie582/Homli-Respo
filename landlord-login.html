<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Landlord Sign In | CampusNest</title>

    <link
        rel="icon"
        href="assets/images/sitelogo.png"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 24px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                #f8fafc;

            color:
                #0f172a;
        }

        .login-container {

            width: 100%;

            max-width: 440px;

            background: #ffffff;

            border-radius: 20px;

            padding: 36px;

            box-shadow:
                0 20px 60px
                rgba(15, 23, 42, 0.10);
        }

        .login-logo {

            text-align: center;

            margin-bottom: 28px;
        }

        .login-logo img {

            width: 170px;

            max-width: 100%;

            height: auto;
        }

        .login-header {

            text-align: center;

            margin-bottom: 28px;
        }

        .login-header h1 {

            font-size: 28px;

            margin-bottom: 8px;
        }

        .login-header p {

            color: #64748b;

            line-height: 1.6;
        }

        .form-group {

            margin-bottom: 18px;
        }

        .form-group label {

            display: block;

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 8px;
        }

        .input-wrapper {

            position: relative;
        }

        .input-wrapper i {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #94a3b8;
        }

        .input-wrapper input {

            width: 100%;

            height: 50px;

            padding:
                0 15px 0 44px;

            border:
                1px solid #cbd5e1;

            border-radius: 12px;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }

        .input-wrapper input:focus {

            border-color:
                #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);
        }

        .login-button {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 12px;

            background:
                #2563eb;

            color: #ffffff;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 8px;

            transition:
                background 0.2s,
                transform 0.2s;
        }

        .login-button:hover {

            background:
                #1d4ed8;

            transform:
                translateY(-1px);
        }

        .login-button:disabled {

            opacity: 0.7;

            cursor: not-allowed;

            transform: none;
        }

        .login-error {

            display: none;

            margin-top: 16px;

            padding: 12px 14px;

            border-radius: 10px;

            background:
                #fef2f2;

            color:
                #b91c1c;

            font-size: 14px;

            line-height: 1.5;
        }

        .login-footer {

            text-align: center;

            margin-top: 22px;

            font-size: 14px;

            color: #64748b;
        }

        .login-footer a {

            color:
                #2563eb;

            text-decoration: none;

            font-weight: 600;
        }

        .test-account {

            margin-top: 24px;

            padding: 14px;

            background:
                #eff6ff;

            border:
                1px solid #bfdbfe;

            border-radius: 12px;

            font-size: 13px;

            line-height: 1.6;

            color:
                #1e40af;
        }

        @media (max-width: 480px) {

            .login-container {

                padding: 26px 20px;

                border-radius: 16px;
            }

            .login-header h1 {

                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <main class="login-container">


        <div class="login-logo">

            <img
                src="assets/images/sitelogo.png"
                alt="CampusNest"
            >

        </div>


        <div class="login-header">

            <h1>
                Landlord Sign In
            </h1>

            <p>
                Sign in to manage your properties
                and respond to students.
            </p>

        </div>


        <form id="landlordLoginForm">


            <div class="form-group">

                <label for="landlordEmail">
                    Email address
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="landlordEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label for="landlordPassword">
                    Password
                </label>

                <div class="input-wrapper">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="landlordPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                id="landlordLoginButton"
                class="login-button"
            >

                <i class="fa-solid fa-right-to-bracket"></i>

                Sign In

            </button>


            <div
                id="loginError"
                class="login-error"
            ></div>


        </form>


        <div class="test-account">

            <strong>
                Development test account
            </strong>

            <br>

            Email:
            landlord@campusnest.test

            <br>

            Use the password you created for this
            Supabase Auth account.

        </div>


        <div class="login-footer">

            CampusNest landlord portal

        </div>


    </main>


<!-- ==========================================
     CAMPUSNEST AUTHENTICATION SCRIPTS
========================================== -->

<!-- Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Supabase Client -->
<script src="js/supabase/supabaseClient.js"></script>

<!-- Shared Authentication Utilities -->
<script src="js/auth/auth-utils.js"></script>

<!-- Landlord Login -->
<script src="js/auth/landlord-login.js"></script>


</body>

</html>
